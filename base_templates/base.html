
{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="{% static 'style/style.css' %}">
  <link rel="stylesheet" href="{% static 'style/swiper.css' %}">
  <link rel="stylesheet" href="{% static 'style/media.css' %}">

  <title>{% block title %}Digitalstore{% endblock title %}</title>
</head>

<body>

  {% include 'layout/_header.html' %}
 
  {% if messages %}
    <div class="container site-messages">
      {% for message in messages %}<p class="site-message {{ message.tags }}">{{ message }}</p>{% endfor %}
    </div>
  {% endif %}

  {% block main %}
  {% endblock main %}

  {% include 'layout/_footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-element-bundle.min.js"></script>
  <script src="{% static 'js/script.js' %}"></script>

</body>
</html>
